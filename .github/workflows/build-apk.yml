name: Build ETHIO debug APK

# Manual trigger only. Builds the Flutter app in mobile/ as a debug
# APK and uploads it as a downloadable artifact. The Docker workflow
# (build.yml) is unrelated and untouched.
#
# Required repository Variables (Settings -> Secrets and variables ->
# Actions -> Variables) - both are NON-secret configuration:
#   ETHIO_ANON_KEY     Supabase anon/publishable key for project ethio
#   ETHIO_GATEWAY_URL  Gateway the phone must reach, e.g.
#                      http://192.168.1.20:8000 (the pilot PC's LAN IP)
# The service-role key is NEVER used here and must never be added.

on:
  workflow_dispatch:
  push:
    branches: [work/ethio-market-readiness]


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          if [ -z "${{ vars.ETHIO_ANON_KEY }}" ]; then
            echo "::error::Repository variable ETHIO_ANON_KEY is not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          if [ -z "${{ vars.ETHIO_GATEWAY_URL }}" ]; then
            echo "::error::Repository variable ETHIO_GATEWAY_URL is not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=ETHIO_SUPABASE_URL=https://zvkkhojqwnsuggeslhga.supabase.co \
            --dart-define=ETHIO_SUPABASE_ANON_KEY=${{ vars.ETHIO_ANON_KEY }} \
            --dart-define=ETHIO_GATEWAY_URL=${{ vars.ETHIO_GATEWAY_URL }} \
            --dart-define=ETHIO_GATEWAY_AUTH_MODE=jwt \
            --dart-define=ETHIO_SESSION_ID=pilot

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethio-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
